<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logs Reader</title>
<style>
  /* Themes also apply to any element carrying data-theme, which is how the settings swatches preview them. */
  :root, [data-theme=light] { --bg: #ffffff; --fg: #1d1d1f; --muted: #6b6b72; --line: #e2e2e6; --panel: #f6f6f8; --code: #f2f3f5; --accent: #2f6fde; }
  [data-theme=dark] { --bg: #141416; --fg: #e6e6ea; --muted: #9a9aa3; --line: #2b2b31; --panel: #1b1b1f; --code: #1f1f24; --accent: #7aa7ff; color-scheme: dark; }
  [data-theme=green] { --bg: #f4f8f5; --fg: #1f2d24; --muted: #5f7366; --line: #d6e4da; --panel: #eaf2ec; --code: #e4eee7; --accent: #12773f; }
  [data-theme=teal] { --bg: #f1f8f8; --fg: #1b2d2e; --muted: #587274; --line: #cfe3e3; --panel: #e6f2f2; --code: #dfeeee; --accent: #0e7476; }
  [data-theme=orange] { --bg: #fdf7f2; --fg: #2e2119; --muted: #7a6455; --line: #eedccd; --panel: #f8ede3; --code: #f5e7da; --accent: #b9530f; }
  [data-theme=yellow] { --bg: #fdf9ea; --fg: #2b2716; --muted: #6e6850; --line: #ebe3c3; --panel: #f7f1db; --code: #f2ebd0; --accent: #8a6200; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template-columns: calc(270px * var(--side, 1)) 1fr;
         font: 14px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--fg); accent-color: var(--accent); }
  aside { overflow: auto; padding: 12px; font-size: calc(var(--side, 1) * 1em); background: var(--panel); border-right: 1px solid var(--line); }
  main { overflow: auto; padding: 0 16px 16px; }
  h2 { margin: 14px 0 6px; font-size: .86em; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .dir { margin: 10px 0 2px; font-size: .8em; color: var(--muted); word-break: break-all; }
  aside button { display: block; width: 100%; padding: 4px 6px; border: 0; border-radius: 4px; text-align: left;
                 font: inherit; color: inherit; background: none; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  aside button:hover { background: var(--line); }
  aside button.on { background: color-mix(in srgb, var(--accent) 22%, transparent); }
  aside small { color: var(--muted); }
  .bar { position: sticky; top: 0; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
         padding: 10px 0; background: var(--bg); border-bottom: 1px solid var(--line); }
  .bar input[type=search] { flex: 1 1 220px; padding: 5px 8px; font: inherit; color: inherit; background: var(--code);
                            border: 1px solid var(--line); border-radius: 4px; }
  .bar input[type=number] { width: 4em; font: inherit; }
  #status { color: var(--muted); font-size: 12px; width: 100%; }
  section { margin-top: 16px; }
  h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
  h3 small { font-weight: 400; color: var(--muted); }
  .e { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; padding: 4px 0; border-top: 1px solid var(--line); }
  .e time, .e .f { font-size: 12px; color: var(--muted); }
  .e .d { grid-column: 2; }
  pre { grid-column: 2; margin: 2px 0 0; padding: 6px 8px; max-height: 16em; overflow: auto; background: var(--code);
        border-radius: 4px; font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; }
  .empty { margin-top: 40px; color: var(--muted); text-align: center; }
  .bar button, dialog button, .hex, .e button { padding: 4px 10px; font: inherit; color: inherit; background: var(--code);
                                                border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
  .e button { grid-column: 1; justify-self: start; align-self: start; display: grid; place-items: center;
              width: 24px; height: 20px; padding: 0; font-size: 12px; color: var(--muted); }
  dialog { width: min(760px, calc(100% - 32px)); padding: 4px 20px 20px; color: var(--fg); background: var(--bg);
           border: 1px solid var(--line); border-radius: 8px; }
  dialog::backdrop { background: rgb(0 0 0 / .4); }
  dialog form > button { display: block; margin: 18px 0 0 auto; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--min, 200px), 1fr)); gap: 8px; }
  .card { position: relative; display: flex; gap: 12px; align-items: center; padding: 10px 12px;
          border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  .card:has(:checked) { border-color: var(--accent); }
  .card:has(:focus-visible) { outline: 2px solid var(--accent); }
  .card input { position: absolute; opacity: 0; pointer-events: none; }
  .card small, .color small { display: block; font-size: 12px; color: var(--muted); }
  .sw { display: grid; align-content: center; gap: 4px; flex: none; width: 38px; height: 38px; padding: 0 7px;
        background: var(--bg); border: 1px solid var(--line); border-radius: 4px; }
  .sw i { width: 60%; height: 4px; border-radius: 2px; background: var(--line); }
  .sw i:first-child { width: auto; background: var(--accent); }
  .sw i:nth-child(2) { width: 75%; background: var(--muted); }
  .aa { line-height: 1; }
  .color { display: grid; grid-template-columns: auto 1fr 7em auto; gap: 12px; align-items: center; margin: 8px 0; }
  .color input[type=color] { width: 40px; height: 40px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; }
  .hex { min-width: 0; font-family: ui-monospace, monospace; cursor: text; }
  @media (max-width: 700px) {
    body { height: auto; grid-template-columns: 1fr; }
    aside { max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--line); }
    .color { grid-template-columns: auto 1fr auto; }
    .hex { display: none; }
  }
</style>
</head>
<body>
<aside>
  <h2>Recent</h2><div id="recent"></div>
  <h2>Files</h2><div id="files"></div>
  <h2>Local</h2>
  <label><small>Open or drop .log / .jsonl files</small><input id="pick" type="file" accept=".log,.jsonl" multiple></label>
</aside>
<main>
  <div class="bar">
    <strong id="title">No log open</strong>
    <input id="q" type="search" placeholder="Search commands and descriptions">
    <label><input id="ro" type="checkbox"> Hide read-only</label>
    <label>Session gap <input id="gap" type="number" min="1" value="30"> min</label>
    <button id="gear" type="button">Settings</button>
    <div id="status"></div>
  </div>
  <div id="out"><p class="empty">Pick a log on the left.</p></div>
</main>
<dialog id="settings" closedby="any">
  <form method="dialog">
    <h2>Appearance</h2><div class="cards" id="themes"></div>
    <h2>Colours</h2>
    <div class="color"><input type="color" name="accent" aria-label="Theme colour"><span>Theme colour<small>The open file, checkboxes, chosen settings</small></span>
      <input class="hex" name="accent" maxlength="7" spellcheck="false" aria-label="Theme colour hex"><button type="button" data-reset="accent">Reset</button></div>
    <div class="color"><input type="color" name="fg" aria-label="Text colour"><span>Text colour<small>Commands, titles, file names</small></span>
      <input class="hex" name="fg" maxlength="7" spellcheck="false" aria-label="Text colour hex"><button type="button" data-reset="fg">Reset</button></div>
    <h2>Sidebar text</h2><div class="cards" id="sizes" style="--min: 150px"></div>
    <button>Done</button>
  </form>
</dialog>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const base = p => p.split('/').pop();
const ALL = '*';
let files = [], entries = [], current = null;

// Old hook format: "[YYYY-MM-DD HH:MM:SS] command", command may span lines. New: one JSON object per line.
function parse(text, file) {
  if (file.endsWith('.jsonl')) {
    return text.split('\n').flatMap(l => { try { return [{ ...JSON.parse(l), file }]; } catch { return []; } });
  }
  const ms = [...text.matchAll(/^\[(\d{4}-\d\d-\d\d \d\d:\d\d:\d\d)\] /gm)];
  return ms.map((m, i) => ({ ts: m[1], file, cmd: text.slice(m.index + m[0].length, ms[i + 1]?.index ?? text.length).trimEnd() }));
}

// ponytail: verb heuristic — read-only only if every segment starts with a read verb and nothing is written;
// anything inside python3/heredocs/loops counts as not read-only. Extend READ if real reads slip through.
const READ = /^(cd|grep|rg|cat|ls|head|tail|wc|find|sed|echo|printf|which|type|stat|du|df|diff|file|tree|pwd|jq|awk|sort|uniq|cut|tr|nl|column|readlink|realpath|basename|dirname|md5sum|sha256sum|date|read|test|true|make -n|git (status|log|diff|show|branch|remote|rev-parse|ls-files|check-ignore|blame)|kubectl (get|describe|logs|config|kustomize|explain)|helm (template|lint|list|show|get|status|version)|docker (ps|images|logs|inspect))\b/;
// Shell glue that runs nothing itself: loop/if keywords, plain variable assignments.
const GLUE = /^(done|fi|esac|for \w+ in .*|[A-Za-z_]\w*=\S*)$/;
function readOnly(cmd) {
  const s = cmd.replace(/'[^']*'|"(?:[^"\\]|\\.)*"/g, '""');
  if (/\bsed\b[^|;&\n]*\s-i|\s-(delete|exec)\b|(^|[^0-9&])>>?(?!\s*(\/dev\/null|&))/.test(s)) return false;
  return s.split(/&&|\|\||[;|\n]/).every(seg => {
    seg = seg.trim().replace(/^(do|then|else|if|while|until|!)\s+/, '');
    return !seg || GLUE.test(seg) || READ.test(seg);
  });
}

// Entries with a session id group by it; old entries without one split on time gaps.
function sessions(list, gapMin) {
  const byId = new Map(), out = [];
  let cur = null;
  for (const e of list) {
    e.t ??= Date.parse(e.ts.replace(' ', 'T'));
    if (e.session) {
      if (!byId.has(e.session)) { byId.set(e.session, { id: e.session, items: [] }); out.push(byId.get(e.session)); }
      byId.get(e.session).items.push(e);
    } else {
      if (!cur || e.t - cur.items.at(-1).t > gapMin * 60e3) out.push(cur = { items: [] });
      cur.items.push(e);
    }
  }
  return out.sort((a, b) => b.items.at(-1).t - a.items.at(-1).t);
}

const COPY = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
  <rect x="8" y="2" width="13" height="16" rx="2"/><path d="M8 6H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-2"/></svg>`;

function render() {
  const q = $('#q').value.toLowerCase(), hideRo = $('#ro').checked;
  let shown = 0, hidden = 0, html = '';
  const groups = sessions(entries, +$('#gap').value || 30);
  for (const g of groups) {
    const items = g.items.filter(e => {
      if (q && !`${e.cmd}\n${e.desc ?? ''}`.toLowerCase().includes(q)) return false;
      if (hideRo && (e.ro ??= readOnly(e.cmd))) { hidden++; return false; }
      return true;
    });
    if (!items.length) continue;
    shown += items.length;
    const first = g.items[0].ts, last = g.items.at(-1).ts;
    const where = [...new Set(g.items.map(e => e.file))].join(', ');
    html += `<section><h3>${esc(first.slice(0, 16))} → ${esc(last.slice(first.slice(0, 10) === last.slice(0, 10) ? 11 : 0, 16))}
      <small>· ${items.length}/${g.items.length} commands · ${esc(where)}${g.id ? ' · ' + esc(g.id.slice(0, 8)) : ''}</small></h3>`;
    for (const e of items) {
      html += `<div class="e"><time>${esc(e.ts.slice(11))}</time><span class="f" title="${esc(e.cwd)}">${esc(e.file)}</span><button title="Copy command" aria-label="Copy command">${COPY}</button>
        ${e.desc ? `<span class="d">${esc(e.desc)}</span>` : ''}<pre>${esc(e.cmd)}</pre></div>`;
    }
    html += '</section>';
  }
  $('#out').innerHTML = html || '<p class="empty">Nothing matches.</p>';
  $('#status').textContent = `${shown} of ${entries.length} commands shown` + (hidden ? ` · ${hidden} read-only hidden` : '');
}

function load(list, title) {
  entries = list.sort((a, b) => a.ts.localeCompare(b.ts));
  $('#title').textContent = title;
  render();
}

// Recent list and settings live in localStorage; storage can be unavailable (private mode), so reads fall back.
const stored = (key, fallback) => { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } };
const store = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} };
function recent() { return stored('recent', []); }
function remember(path) { store('recent', [path, ...recent().filter(p => p !== path)].slice(0, 10)); }

// Settings: theme (starts from the OS light/dark preference), colour overrides ('' = theme's own), sidebar text scale.
const THEMES = [['light', 'Light', 'The default'], ['dark', 'Dark', 'For a dim room'], ['green', 'Green', 'Cool, low contrast'],
  ['teal', 'Teal', 'Cool, cooler still'], ['orange', 'Orange', 'Warm'], ['yellow', 'Yellow', 'Warm, paper-like']];
const SIZES = [[0.8, 'Small', 'A fifth smaller'], [1, 'Normal', 'The default'], [1.2, 'Large', 'A fifth larger'], [1.4, 'Maximal', 'Two fifths larger']];
let prefs = { theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light', accent: '', fg: '', side: 1, ...stored('settings', {}) };

const card = (name, value, icon, label, sub) =>
  `<label class="card"><input type="radio" name="${name}" value="${value}">${icon}<span>${label}<small>${sub}</small></span></label>`;
$('#themes').innerHTML = THEMES.map(([v, l, s]) => card('theme', v, `<span class="sw" data-theme="${v}"><i></i><i></i><i></i></span>`, l, s)).join('');
$('#sizes').innerHTML = SIZES.map(([v, l, s]) => card('side', v, `<span class="aa" style="font-size:${v * 28}px">Aa</span>`, l, s)).join('');

function applyPrefs() {
  const root = document.documentElement;
  root.dataset.theme = prefs.theme;
  root.style.setProperty('--side', prefs.side);
  for (const k of ['accent', 'fg']) prefs[k] ? root.style.setProperty('--' + k, prefs[k]) : root.style.removeProperty('--' + k);
  // Show the colour in effect (override or theme's), but don't rewrite a hex field mid-typing.
  const css = getComputedStyle(root);
  for (const el of $('#settings').querySelectorAll('input')) {
    if (el.type === 'radio') el.checked = el.value == prefs[el.name];
    else if (el !== document.activeElement) el.value = css.getPropertyValue('--' + el.name).trim();
  }
}
function setPref(k, v) { prefs[k] = v; store('settings', prefs); applyPrefs(); }
$('#settings').addEventListener('input', ({ target: el }) => {
  if (el.type === 'radio') setPref(el.name, el.name === 'side' ? +el.value : el.value);
  else if (/^#[0-9a-f]{6}$/i.test(el.value)) setPref(el.name, el.value.toLowerCase());
});
$('#settings').addEventListener('click', e => { if (e.target.dataset.reset) setPref(e.target.dataset.reset, ''); });
$('#gear').addEventListener('click', () => $('#settings').showModal());
applyPrefs();

async function open(path) {
  const paths = path === ALL ? files.map(f => f.path) : [path];
  const texts = await Promise.all(paths.map(p => fetch('/api/file?path=' + encodeURIComponent(p)).then(r => r.ok ? r.text() : null)));
  if (texts.every(t => t === null)) { $('#status').textContent = `Not found: ${path}`; return; }
  current = path;
  remember(path);
  load(texts.flatMap((t, i) => t === null ? [] : parse(t, base(paths[i]))), path === ALL ? 'All files' : base(path));
  sidebar();
}

function sidebar() {
  const btn = (path, label, sub) =>
    `<button data-path="${esc(path)}" title="${esc(path)}" class="${path === current ? 'on' : ''}">${esc(label)} <small>${esc(sub)}</small></button>`;
  $('#recent').innerHTML = recent().filter(p => p !== ALL).slice(0, 5).map(p => btn(p, base(p), p.slice(0, -base(p).length))).join('')
    || '<small>Nothing opened yet.</small>';
  let dir = null, html = files.length ? btn(ALL, 'All files', `${files.length} files`) : '<small>No server: drop files below.</small>';
  for (const f of files) {
    if (f.dir !== dir) html += `<div class="dir">${esc(dir = f.dir)}</div>`;
    html += btn(f.path, f.name);
  }
  $('#files').innerHTML = html;
}

document.addEventListener('click', e => { const b = e.target.closest('button[data-path]'); if (b) open(b.dataset.path); });
// Copy button under each timestamp copies that entry's command.
document.addEventListener('click', e => {
  const b = e.target.closest('.e button');
  if (b) navigator.clipboard.writeText(b.closest('.e').querySelector('pre').textContent).then(() => '✓', () => '✗')
    .then(t => { b.textContent = t; setTimeout(() => b.innerHTML = COPY, 1200); });
});
for (const id of ['#q', '#ro', '#gap']) $(id).addEventListener('input', render);

async function readLocal(list) {
  list = [...list].filter(f => /\.(log|jsonl)$/.test(f.name));
  if (!list.length) return;
  current = null;
  load((await Promise.all(list.map(async f => parse(await f.text(), f.name)))).flat(), `${list.length} local file(s)`);
  sidebar();
}
$('#pick').addEventListener('change', e => readLocal(e.target.files));
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); readLocal(e.dataTransfer.files); });

fetch('/api/files').then(r => r.json()).then(f => { files = f; }).catch(() => {}).finally(() => {
  sidebar();
  const last = recent()[0];
  if (last && (last === ALL ? files.length : files.some(f => f.path === last))) open(last);
});
</script>
</body>
</html>
